<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SecureGraphical | Account</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav class="navbar">

    <a
        href="{{ url_for('dashboard') }}"
        class="brand">

        <div class="brand-icon">
            ◆
        </div>

        <div class="brand-text">
            Secure<span>Graphical</span>
        </div>

    </a>

</nav>


<main class="page container">

    <div class="page-title">

        <div class="eyebrow">
            Account
        </div>

        <h1>
            Your profile
        </h1>

        <p>
            Manage your SecureGraphical account information.
        </p>

    </div>


    <div class="card form-card">

        <div class="form-group">

            <label>
                Full Name
            </label>

            <input
                type="text"
                value="{{ user['name'] }}"
                readonly>

        </div>


        <div class="form-group">

            <label>
                Email Address
            </label>

            <input
                type="email"
                value="{{ user['email'] }}"
                readonly>

        </div>


        <div class="form-group">

            <label>
                Account Status
            </label>

            <input
                type="text"
                value="Active"
                readonly>

        </div>


        <div class="form-group">

            <label>
                Authentication Method
            </label>

            <input
                type="text"
                value="Password + Graphical Password"
                readonly>

        </div>


        <a
            href="{{ url_for('settings') }}"
            class="button">

            Security Settings

        </a>

    </div>

</main>


<footer class="footer">
    SecureGraphical Account Management
</footer>

</body>

</html>
