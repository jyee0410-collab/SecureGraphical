<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Graphical Password</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="page">

    <div class="graphical-page">

        <div class="graphical-header">

            <div>

                <span class="hero-badge">
                    STEP 2
                </span>

                <h1>
                    Graphical Authentication
                </h1>

                <p>
                    Select your three graphical password characters
                    and authentication colour.
                </p>

            </div>

            <a
                href="{{ url_for('logout') }}"
                class="logout-button"
            >
                Logout
            </a>

        </div>


        <div class="graphical-card">

            <div class="instruction-card">

                <span>
                    🔐
                </span>

                <div>

                    <strong>
                        Security Instruction
                    </strong>

                    <p>
                        Select exactly three characters in the
                        correct order, then choose your pass colour.
                    </p>

                </div>

            </div>


            <div
                id="graphicalGrid"
                class="large-graphical-grid"
            ></div>


            <div class="selected-panel">

                <h3>
                    Selected Characters
                </h3>

                <div
                    id="selectedCharacters"
                    class="selected-characters"
                ></div>

                <button
                    type="button"
                    class="secondary-button"
                    onclick="clearSelection()"
                >
                    Clear Selection
                </button>

            </div>


            <div class="pass-color-box">

                <h3>
                    Select Pass Colour
                </h3>

                <div class="pass-colors">

                    <button
                        class="color-choice"
                        data-color="Red"
                        style="--color:#ef4444"
                        onclick="selectColor(this)"
                    ></button>

                    <button
                        class="color-choice"
                        data-color="Blue"
                        style="--color:#3b82f6"
                        onclick="selectColor(this)"
                    ></button>

                    <button
                        class="color-choice"
                        data-color="Green"
                        style="--color:#22c55e"
                        onclick="selectColor(this)"
                    ></button>

                    <button
                        class="color-choice"
                        data-color="Yellow"
                        style="--color:#eab308"
                        onclick="selectColor(this)"
                    ></button>

                    <button
                        class="color-choice"
                        data-color="Purple"
                        style="--color:#a855f7"
                        onclick="selectColor(this)"
                    ></button>

                    <button
                        class="color-choice"
                        data-color="Orange"
                        style="--color:#f97316"
                        onclick="selectColor(this)"
                    ></button>

                    <button
                        class="color-choice"
                        data-color="Pink"
                        style="--color:#ec4899"
                        onclick="selectColor(this)"
                    ></button>

                    <button
                        class="color-choice"
                        data-color="Cyan"
                        style="--color:#06b6d4"
                        onclick="selectColor(this)"
                    ></button>

                </div>

                <div id="selectedColorText">
                    No colour selected
                </div>

            </div>


            <button
                class="primary-button"
                onclick="finishAuthentication()"
            >
                Continue Securely
            </button>

        </div>

    </div>

</div>


<script>

let selected = [];
let passColor = "";


async function loadGrid() {

    const response =
        await fetch(
            "{{ url_for('generate_grid') }}"
        );

    const data =
        await response.json();

    const grid =
        document.getElementById(
            "graphicalGrid"
        );

    grid.innerHTML = "";

    grid.style.transform =
        `rotate(${data.rotation}deg)`;

    data.grid.forEach(
        item => {

            const button =
                document.createElement(
                    "button"
                );

            button.type =
                "button";

            button.className =
                "graphical-button";

            button.dataset.char =
                item.char;

            button.style.setProperty(
                "--tile-color",
                item.hex
            );

            button.innerHTML = `
                <span class="tile-number">
                    ${item.position}
                </span>

                <span class="tile-char">
                    ${item.char}
                </span>

                <span class="tile-color-name">
                    ${item.color}
                </span>
            `;

            button.onclick =
                function() {

                    if (
                        selected.length >= 3
                    ) {
                        return;
                    }

                    selected.push(
                        item.char
                    );

                    button.classList.add(
                        "selected"
                    );

                    updateSelected();

                };

            grid.appendChild(
                button
            );

        }
    );

}


function updateSelected() {

    const container =
        document.getElementById(
            "selectedCharacters"
        );

    container.innerHTML = "";

    selected.forEach(
        (item, index) => {

            const span =
                document.createElement(
                    "span"
                );

            span.className =
                "selected-character";

            span.textContent =
                `${index + 1}: ${item}`;

            container.appendChild(
                span
            );

        }
    );

}


function clearSelection() {

    selected = [];

    document
        .querySelectorAll(
            ".graphical-button"
        )
        .forEach(
            button =>
                button.classList.remove(
                    "selected"
                )
        );

    updateSelected();

}


function selectColor(button) {

    document
        .querySelectorAll(
            ".color-choice"
        )
        .forEach(
            item =>
                item.classList.remove(
                    "selected"
                )
        );

    button.classList.add(
        "selected"
    );

    passColor =
        button.dataset.color;

    document.getElementById(
        "selectedColorText"
    ).textContent =
        "Selected: " + passColor;

}


function finishAuthentication() {

    if (selected.length !== 3) {

        alert(
            "Please select exactly 3 characters."
        );

        return;

    }

    if (!passColor) {

        alert(
            "Please select a pass colour."
        );

        return;

    }

    alert(
        "Graphical authentication completed."
    );

}


document.addEventListener(
    "DOMContentLoaded",
    loadGrid
);

</script>

</body>

</html>
